<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Lucky Draw System - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            width: 320px;
            height: 320px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 8em;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        p {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 20px 50px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(76, 175, 80, 0.6);
        }

        .btn:active {
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9em;
        }

        footer a {
            color: #FFDD00;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin: 0 5px;
        }

        footer a:hover {
            color: #FFE55C;
            text-decoration: underline;
        }

        .coffee-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: rgba(255, 221, 0, 0.2);
            border: 2px solid #FFDD00;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .coffee-link:hover {
            background: rgba(255, 221, 0, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            .logo {
                width: 200px;
                height: 200px;
            }

            .logo-placeholder {
                font-size: 5em;
            }

            h1 {
                font-size: 2.5em;
            }

            p {
                font-size: 1.1em;
            }

            .btn {
                padding: 15px 40px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Lucky Draw Logo" id="logoImage" style="display:none;">
            <div class="logo-placeholder" id="logoPlaceholder">🎰</div>
        </div>
        <h1>Lucky Draw System</h1>
        <p>ระบบสุ่มรางวัลที่ทันสมัย เหมาะสำหรับงานอีเว้นท์
การจัดกิจกรรมภายในองค์กร หรืองานเลี้ยงสังสรรค์</p>
        <a href="lucky-draw.html" class="btn" id="enterBtn">เริ่มใช้งาน</a>
    </div>

    <footer>
        <div>2024 natto109©. All Rights Reserved.</div>
        <div class="coffee-link">
            <a href="donate.html">☕ Buy me a coffee</a>
        </div>
         <a href='http://www.freevisitorcounters.com'>freevisitorcounters</a><br> <script type='text/javascript' src='https://www.freevisitorcounters.com/auth.php?id=4ebf1ba984d69799bae5373b319cc50bdd194a90'></script>
<script type="text/javascript" src="https://www.freevisitorcounters.com/en/home/counter/1445421/t/5"></script>
    </footer>

    <script>
        // Check if logo.png exists
        const logoImage = document.getElementById('logoImage');
        const logoPlaceholder = document.getElementById('logoPlaceholder');
        
        logoImage.onerror = function() {
            logoImage.style.display = 'none';
            logoPlaceholder.style.display = 'flex';
        };
        
        logoImage.onload = function() {
            logoImage.style.display = 'block';
            logoPlaceholder.style.display = 'none';
        };
        
        // Try to load the logo
        logoImage.src = 'logo.png';

        // Set session flag when entering
        document.getElementById('enterBtn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.setItem('allowedAccess', 'true');
            window.location.href = 'lucky-draw.html';
        });
    </script>
</body>
</html>
