<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Lucky Draw System - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #fff;
            touch-action: pan-y;
        }

        body:not(.fullscreen-active) {
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
        }

        body.fullscreen-active {
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            background-size: cover;
            background-position: center;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .auto-save-indicator {
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.85em;
            opacity: 0.8;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            color: #333;
        }

        .control-panel h2 {
            margin-bottom: 15px;
            color: #4CAF50;
            font-size: 1.3em;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9em;
        }

        input, textarea, select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-direction: row;
        }

        .checkbox-group input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 0.9em;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
            transform: none !important;
            opacity: 0.6;
        }

        #backHomeBtn {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
        }

        .slot-machine {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            position: relative;
            overflow: visible;
        }

        .slot-window {
            background: #ffffff;
            border-radius: 15px;
            height: 250px;
            overflow: hidden;
            position: relative;
            border: 5px solid #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .slot-items {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-item {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            position: absolute;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .slot-item.active {
            opacity: 1;
        }

        .slot-item .employee-id {
            font-size: 2.5em;
            font-weight: 900;
            color: #2196F3;
            margin-bottom: 10px;
            font-family: 'Noto Sans Thai', sans-serif;
            word-break: break-all;
        }

        .slot-item .employee-name {
            font-size: 1.5em;
            color: #000;
            font-weight: 700;
            font-family: 'Noto Sans Thai', sans-serif;
            word-break: break-word;
        }

        /* Single line display when no comma */
        .slot-item:has(.employee-name:only-child) .employee-name {
            font-size: 2em;
        }

        .initial-message {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2196F3;
            text-align: center;
            font-size: 2.5em;
            font-weight: 900;
            animation: pulseMessage 2s infinite;
            font-family: 'Noto Sans Thai', sans-serif;
            padding: 20px;
        }

        @keyframes pulseMessage {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .slot-item.winner-blink {
            animation: blink 0.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Mobile Draw Button */
        .mobile-draw-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: none;
        }

        /* Only show button in fullscreen mode */
        body.fullscreen-active .mobile-draw-button.show {
            display: block !important;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% { transform: translateX(-50%) scale(0); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .mobile-draw-button button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: 5px solid white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            font-size: 1.2em;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mobile-draw-button button:active:not(:disabled) {
            transform: scale(0.9);
        }

        .mobile-draw-button button .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .mobile-draw-button button.next-mode {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }

        /* Fullscreen Mode */
        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: transparent;
        }

        .fullscreen-mode .slot-window {
            width: 95vw;
            height: 60vh;
            border: 8px solid #667eea;
            max-width: none;
        }

        .fullscreen-mode .slot-item .employee-id {
            font-size: 4em;
        }

        .fullscreen-mode .slot-item .employee-name {
            font-size: 2.5em;
        }

        /* Single line in fullscreen */
        .fullscreen-mode .slot-item:has(.employee-name:only-child) .employee-name {
            font-size: 3.5em;
        }

        .fullscreen-mode .initial-message {
            font-size: 4em;
        }

        .hidden {
            display: none !important;
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            color: #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .stats h2 {
            margin-bottom: 15px;
            color: #4CAF50;
            font-size: 1.3em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .stat-item .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-item .stat-label {
            font-size: 0.75em;
            opacity: 0.9;
        }

        .winners-list {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .winner-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }

        .winner-item .winner-number {
            background: #4CAF50;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .winner-item div:last-child {
            font-size: 0.9em;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #4CAF50;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .file-input-label:active {
            background: #e9ecef;
        }

        /* Landscape mode on mobile */
        @media (orientation: landscape) and (max-height: 500px) {
            .slot-window {
                height: 200px;
            }

            .fullscreen-mode .slot-window {
                height: 80vh;
            }

            .mobile-draw-button button {
                width: 120px;
                height: 120px;
                font-size: 1em;
            }

            .mobile-draw-button button .icon {
                font-size: 2em;
            }
        }

        /* Tablet and larger */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 3em;
                margin-bottom: 30px;
            }

            .control-panel {
                padding: 30px;
                margin-bottom: 30px;
            }

            .control-panel h2 {
                font-size: 1.5em;
            }

            .control-row {
                flex-direction: row;
                gap: 20px;
            }

            .button-group {
                grid-template-columns: repeat(3, 1fr);
            }

            .slot-window {
                height: 300px;
            }

            .slot-item .employee-id {
                font-size: 3em;
            }

            .slot-item .employee-name {
                font-size: 2em;
            }

            .initial-message {
                font-size: 4em;
            }

            .stats {
                padding: 30px;
            }

            .fullscreen-mode .slot-window {
                width: 80vw;
                height: 40vh;
            }

            .fullscreen-mode .slot-item .employee-id {
                font-size: 8em;
            }

            .fullscreen-mode .slot-item .employee-name {
                font-size: 5em;
            }

            .fullscreen-mode .initial-message {
                font-size: 8em;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="logo.png" alt="Lucky Draw Logo" style="width: 80px; height: 80px; display: inline-block; vertical-align: middle; margin-right: 10px;">
            <h1 style="display: inline-block; vertical-align: middle; margin: 0;">Lucky Draw System</h1>
        </div>

        <div class="auto-save-indicator">
            💾 บันทึกอัตโนมัติ - ข้อมูลของคุณปลอดภัย
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2>⚙️ ตั้งค่าระบบ</h2>
            
            <div class="control-row">
                <div class="control-group">
                    <label>📝 นำเข้าข้อมูลพนักงาน (CSV/TXT)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv,.txt">
                        <label for="fileInput" class="file-input-label">
                            📁 เลือกไฟล์
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label>✏️ หรือกรอกข้อมูลด้วยตนเอง</label>
                    <textarea id="manualInput" placeholder="E001,สมชาย ใจดี
E002,สมหญิง รักสงบ
E003 สมศักดิ์ มีสุข"></textarea>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label>⏱️ เวลาในการสุ่ม (วินาที)</label>
                    <input type="number" id="duration" value="5" min="2" max="30" step="0.5">
                </div>

                <div class="control-group">
                    <label>🖼️ รูปพื้นหลัง (Fullscreen)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="bgInput" accept="image/*">
                        <label for="bgInput" class="file-input-label">
                            📁 เลือกรูปพื้นหลัง
                        </label>
                    </div>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="removeWinner" checked>
                    <label for="removeWinner">🗑️ ลบชื่อผู้ได้รางวัลออกหลังสุ่ม</label>
                </div>
            </div>

            <div class="button-group">
                <button id="loadDataBtn">📥 โหลด</button>
                <button id="fullscreenBtn" disabled>⛶ Fullscreen</button>
                <button id="resetBtn">🔄 รีเซ็ต</button>
                <button id="backHomeBtn">🏠 หน้าแรก</button>
            </div>
        </div>

        <!-- Slot Machine -->
        <div class="slot-machine" id="slotMachine">
            <div class="slot-window" id="slotWindow">
                <div class="initial-message" id="initialMessage">The Winner is...</div>
                <div class="slot-items" id="slotItems" style="display: none;"></div>
            </div>
        </div>

        <!-- Mobile Draw Button -->
        <div class="mobile-draw-button" id="mobileDrawButton">
            <button id="mobileDrawBtn">
                <div class="icon">🎰</div>
                <div>เริ่มสุ่ม</div>
            </button>
        </div>

        <!-- Statistics -->
        <div class="stats">
            <h2>📊 สถิติ</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalEmployees">0</div>
                    <div class="stat-label">ทั้งหมด</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="remainingEmployees">0</div>
                    <div class="stat-label">คงเหลือ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="winnersCount">0</div>
                    <div class="stat-label">ผู้ชนะ</div>
                </div>
            </div>

            <h3 style="margin-top: 20px; margin-bottom: 10px; color: #4CAF50; font-size: 1.1em;">🏆 รายชื่อผู้ได้รางวัล</h3>
            <div class="winners-list" id="winnersList"></div>
        </div>
    </div>

    <script>
        // Check if user came from index.html
        if (!sessionStorage.getItem('allowedAccess')) {
            window.location.href = 'index.html';
        }

        // Auto-save key
        const SAVE_KEY = 'luckyDrawData';

        // Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // State
        let employees = [];
        let originalEmployees = [];
        let isSpinning = false;
        let winners = [];
        let isFullscreen = false;
        let backgroundImage = null;
        let currentSlotIndex = 0;
        let isShowingWinner = false;

        // DOM
        const fileInput = document.getElementById('fileInput');
        const bgInput = document.getElementById('bgInput');
        const manualInput = document.getElementById('manualInput');
        const loadDataBtn = document.getElementById('loadDataBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const resetBtn = document.getElementById('resetBtn');
        const backHomeBtn = document.getElementById('backHomeBtn');
        const mobileDrawBtn = document.getElementById('mobileDrawBtn');
        const mobileDrawButton = document.getElementById('mobileDrawButton');
        const durationInput = document.getElementById('duration');
        const removeWinnerCheckbox = document.getElementById('removeWinner');
        const slotMachine = document.getElementById('slotMachine');
        const slotWindow = document.getElementById('slotWindow');
        const slotItems = document.getElementById('slotItems');
        const initialMessage = document.getElementById('initialMessage');
        const totalEmployeesEl = document.getElementById('totalEmployees');
        const remainingEmployeesEl = document.getElementById('remainingEmployees');
        const winnersCountEl = document.getElementById('winnersCount');
        const winnersListEl = document.getElementById('winnersList');

        // Auto-save
        function saveData() {
            const data = {
                employees,
                originalEmployees,
                winners,
                manualInputValue: manualInput.value,
                durationValue: durationInput.value,
                removeWinnerChecked: removeWinnerCheckbox.checked,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            console.log('Data auto-saved');
        }

        function loadSavedData() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    employees = data.employees || [];
                    originalEmployees = data.originalEmployees || [];
                    winners = data.winners || [];
                    
                    if (data.manualInputValue) manualInput.value = data.manualInputValue;
                    if (data.durationValue) durationInput.value = data.durationValue;
                    removeWinnerCheckbox.checked = data.removeWinnerChecked !== false;
                    
                    if (employees.length > 0) {
                        fullscreenBtn.disabled = false;
                        renderSlotItems();
                        initialMessage.style.display = 'flex';
                        slotItems.style.display = 'none';
                    }
                    
                    updateStats();
                    updateWinnersList();
                    console.log('Data restored');
                    return true;
                } catch (error) {
                    console.error('Error loading data:', error);
                    return false;
                }
            }
            return false;
        }

        function clearAllData() {
            localStorage.removeItem(SAVE_KEY);
            console.log('Data cleared');
        }

        bgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    backgroundImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function enterFullscreen() {
            isFullscreen = true;
            document.body.classList.add('fullscreen-active');
            
            if (backgroundImage) {
                document.body.style.backgroundImage = `url(${backgroundImage})`;
            } else {
                document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%)';
            }
            
            slotMachine.classList.add('fullscreen-mode');
            document.querySelectorAll('.container > *:not(.slot-machine)').forEach(el => {
                el.style.display = 'none';
            });
            
            // Show mobile button in fullscreen if data is loaded
            if (employees.length > 0) {
                console.log('Showing mobile button, employees:', employees.length);
                mobileDrawButton.classList.add('show');
                console.log('Button classes:', mobileDrawButton.className);
                console.log('Button display:', window.getComputedStyle(mobileDrawButton).display);
            } else {
                console.log('No employees loaded, button not shown');
            }
        }

        function exitFullscreen() {
            isFullscreen = false;
            document.body.classList.remove('fullscreen-active');
            document.body.style.backgroundImage = '';
            document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%)';
            slotMachine.classList.remove('fullscreen-mode');
            document.querySelectorAll('.container > *').forEach(el => {
                el.style.display = '';
            });
            
            // Hide mobile button when exit fullscreen
            mobileDrawButton.classList.remove('show');
        }

        fullscreenBtn.addEventListener('click', enterFullscreen);

        // Touch and keyboard
        document.addEventListener('keydown', (e) => {
            // Backslash key (\) to start or continue
            if (e.code === 'Backslash') {
                e.preventDefault();
                handleDrawAction();
            }
            // ESC to exit fullscreen
            if (e.code === 'Escape' && isFullscreen) {
                exitFullscreen();
            }
        });

        // Mobile button click and touch
        mobileDrawBtn.addEventListener('click', handleDrawAction);
        mobileDrawBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleDrawAction();
        });

        function handleDrawAction() {
            if (isShowingWinner) {
                const currentWinnerElement = document.querySelector('.slot-item.winner-blink');
                if (currentWinnerElement) {
                    const winnerDataIndex = parseInt(currentWinnerElement.getAttribute('data-index'));
                    if (removeWinnerCheckbox.checked && winnerDataIndex >= 0) {
                        employees.splice(winnerDataIndex, 1);
                    }
                }
                
                if (employees.length > 0) renderSlotItems();
                
                document.querySelectorAll('.slot-item').forEach(item => {
                    item.classList.remove('winner-blink', 'active');
                });
                
                initialMessage.textContent = 'The Winner is...';
                initialMessage.style.display = 'flex';
                slotItems.style.display = 'none';
                isShowingWinner = false;
                updateStats();
                saveData();
                
                if (employees.length > 0) {
                    mobileDrawBtn.innerHTML = '<div class="icon">🎰</div><div>เริ่มสุ่ม</div>';
                    mobileDrawBtn.classList.remove('next-mode');
                    mobileDrawBtn.disabled = false;
                } else {
                    alert('สุ่มครบทุกคนแล้ว!');
                    initialMessage.textContent = 'All Winners Drawn!';
                    mobileDrawBtn.disabled = true;
                }
            } else if (!isSpinning && employees.length > 0) {
                startSpin();
            }
        }

        function playSpinSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 600;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.03, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.05);
        }

        function playWinSound() {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                const t = audioContext.currentTime + (i * 0.15);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t);
                osc.stop(t + 0.5);
            });
        }

        function parseEmployeeData(text) {
            const lines = text.trim().split('\n');
            const parsed = [];
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                const parts = trimmed.includes(',') ? trimmed.split(',') : trimmed.split(/\s+/);
                if (parts.length >= 2) {
                    parsed.push({
                        id: parts[0].trim(),
                        name: parts.slice(1).join(' ').trim()
                    });
                } else if (parts.length === 1) {
                    parsed.push({
                        id: parts[0].trim(),
                        name: parts[0].trim()
                    });
                }
            }
            return parsed;
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    manualInput.value = event.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        loadDataBtn.addEventListener('click', () => {
            const data = manualInput.value;
            if (!data.trim()) {
                alert('❌ กรุณากรอกข้อมูล');
                return;
            }

            employees = parseEmployeeData(data);
            originalEmployees = [...employees];
            
            if (employees.length === 0) {
                alert('❌ ไม่พบข้อมูลที่ถูกต้อง');
                return;
            }

            updateStats();
            fullscreenBtn.disabled = false;
            renderSlotItems();
            initialMessage.style.display = 'flex';
            slotItems.style.display = 'none';
            saveData();
            alert(`✅ โหลดข้อมูลสำเร็จ!\n\nพบพนักงาน ${employees.length} คน\n\nกด Fullscreen เพื่อเริ่มสุ่ม`);
        });

        function renderSlotItems() {
            if (employees.length === 0) return;
            slotItems.innerHTML = '';
            employees.forEach((employee, index) => {
                const item = document.createElement('div');
                item.className = 'slot-item';
                item.setAttribute('data-index', index);
                
                // Check if ID and name are the same (no comma in input)
                if (employee.id === employee.name) {
                    // Single line, centered
                    item.innerHTML = `
                        <div class="employee-name">${employee.name}</div>
                    `;
                } else {
                    // Two lines: ID and name
                    item.innerHTML = `
                        <div class="employee-id">${employee.id}</div>
                        <div class="employee-name">${employee.name}</div>
                    `;
                }
                
                slotItems.appendChild(item);
            });
        }

        function startSpin() {
            if (isSpinning || employees.length === 0) return;
            isSpinning = true;
            initialMessage.style.display = 'none';
            slotItems.style.display = 'block';
            
            const duration = parseFloat(durationInput.value) * 1000;
            const startTime = Date.now();
            currentSlotIndex = 0;
            let currentDelay = 50;
            
            function animateStep() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                
                if (progress >= 1) {
                    finishSpin();
                    return;
                }
                
                document.querySelectorAll('.slot-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                const items = document.querySelectorAll('.slot-item');
                if (items.length > 0) {
                    currentSlotIndex = (currentSlotIndex + 1) % items.length;
                    items[currentSlotIndex].classList.add('active');
                    if (progress < 0.9) playSpinSound();
                }
                
                currentDelay = 50 * (1 + progress * 8);
                setTimeout(animateStep, currentDelay);
            }
            
            animateStep();
        }

        function finishSpin() {
            const winnerIndex = Math.floor(Math.random() * employees.length);
            const winner = employees[winnerIndex];
            
            document.querySelectorAll('.slot-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const items = document.querySelectorAll('.slot-item');
            if (items[winnerIndex]) {
                items[winnerIndex].classList.add('active');
            }
            
            setTimeout(() => {
                playWinSound();
                if (items[winnerIndex]) {
                    items[winnerIndex].classList.add('winner-blink');
                    winners.push(winner);
                    updateWinnersList();
                    updateStats();
                    saveData();
                    isSpinning = false;
                    isShowingWinner = true;
                    
                    // Change button to "Next"
                    mobileDrawBtn.innerHTML = '<div class="icon">➡️</div><div>ต่อไป</div>';
                    mobileDrawBtn.classList.add('next-mode');
                    
                    if (removeWinnerCheckbox.checked && employees.length === 1) {
                        setTimeout(() => {
                            items[winnerIndex].classList.remove('winner-blink');
                            employees.splice(winnerIndex, 1);
                            alert('สุ่มครบทุกคนแล้ว!');
                            initialMessage.textContent = 'All Winners Drawn!';
                            initialMessage.style.display = 'flex';
                            slotItems.style.display = 'none';
                            isShowingWinner = false;
                            mobileDrawBtn.disabled = true;
                            saveData();
                        }, 3000);
                    }
                }
            }, 500);
        }

        function updateStats() {
            totalEmployeesEl.textContent = originalEmployees.length;
            remainingEmployeesEl.textContent = employees.length;
            winnersCountEl.textContent = winners.length;
        }

        function updateWinnersList() {
            winnersListEl.innerHTML = '';
            winners.forEach((winner, index) => {
                const item = document.createElement('div');
                item.className = 'winner-item';
                item.innerHTML = `
                    <div class="winner-number">${index + 1}</div>
                    <div>
                        <strong>${winner.id}</strong> - ${winner.name}
                    </div>
                `;
                winnersListEl.appendChild(item);
            });
        }

        resetBtn.addEventListener('click', () => {
            const msg = winners.length > 0 
                ? `รีเซ็ตระบบ?\n\n⚠️ จะลบ:\n- ผู้ชนะ ${winners.length} คน\n- ข้อมูลที่บันทึก\n\nไม่สามารถยกเลิกได้!`
                : 'รีเซ็ตระบบ?';
            
            if (confirm(msg)) {
                employees = [...originalEmployees];
                winners = [];
                isSpinning = false;
                isShowingWinner = false;
                
                document.querySelectorAll('.slot-item').forEach(item => {
                    item.classList.remove('winner-blink', 'active');
                });
                
                manualInput.value = '';
                fileInput.value = '';
                bgInput.value = '';
                backgroundImage = null;
                slotItems.innerHTML = '';
                winnersListEl.innerHTML = '';
                initialMessage.textContent = 'The Winner is...';
                initialMessage.style.display = 'flex';
                slotItems.style.display = 'none';
                
                if (isFullscreen) exitFullscreen();
                
                updateStats();
                mobileDrawButton.classList.remove('show');
                fullscreenBtn.disabled = true;
                clearAllData();
                alert('✅ รีเซ็ตสำเร็จ!');
            }
        });

        backHomeBtn.addEventListener('click', () => {
            if (confirm('กลับหน้าแรก?')) {
                sessionStorage.removeItem('allowedAccess');
                window.location.href = 'index.html';
            }
        });

        updateStats();
        loadSavedData();
    </script>
