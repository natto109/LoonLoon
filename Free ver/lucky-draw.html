<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        body:not(.fullscreen-active) {
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
        }

        body.fullscreen-active {
            background-size: cover;
            background-position: center;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: #333;
        }

        .control-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        input, textarea, select, button {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-direction: row;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            min-width: 150px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
            transform: none !important;
            opacity: 0.6;
        }

        .slot-machine {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            position: relative;
            overflow: visible;
        }

        .slot-window {
            background: #ffffff;
            border-radius: 15px;
            height: 300px;
            overflow: hidden;
            position: relative;
            border: 5px solid #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .slot-items {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-item {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: absolute;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .slot-item.active {
            opacity: 1;
        }

        .slot-item .employee-id {
            font-size: 3em;
            font-weight: 900;
            color: #2196F3;
            margin-bottom: 10px;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        .slot-item .employee-name {
            font-size: 2em;
            color: #000;
            font-weight: 700;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        /* Single line display when no comma */
        .slot-item:has(.employee-name:only-child) .employee-name {
            font-size: 2.5em;
        }

        .initial-message {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2196F3;
            text-align: center;
            font-size: 4em;
            font-weight: 900;
            animation: pulse 2s infinite;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        .slot-item.winner-blink {
            animation: blink 0.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: transparent;
        }

        .fullscreen-mode .slot-window {
            width: 80vw;
            height: 40vh;
            border: 10px solid #667eea;
            max-width: none;
        }

        .fullscreen-mode .slot-item .employee-id {
            font-size: 8em;
        }

        .fullscreen-mode .slot-item .employee-name {
            font-size: 5em;
        }

        /* Single line in fullscreen */
        .fullscreen-mode .slot-item:has(.employee-name:only-child) .employee-name {
            font-size: 6em;
        }

        .fullscreen-mode .initial-message {
            font-size: 8em;
        }

        .hidden {
            display: none !important;
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            color: #333;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        .stat-item .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-item .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }

        .winners-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .winner-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }

        .winner-item .winner-number {
            background: #4CAF50;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #4CAF50;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e9ecef;
            border-color: #45a049;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .control-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .fullscreen-mode .slot-item .employee-id {
                font-size: 4em;
            }

            .fullscreen-mode .slot-item .employee-name {
                font-size: 2.5em;
            }

            .fullscreen-mode .initial-message {
                font-size: 4em;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="logo.png" alt="Lucky Draw Logo" style="width: 120px; height: 120px; display: inline-block; vertical-align: middle; margin-right: 15px;">
            <h1 style="display: inline-block; vertical-align: middle; margin: 0;">Lucky Draw System</h1>
        </div>

        <!-- Auto-save indicator -->
        <!-- <div style="text-align: center; margin-bottom: 10px; font-size: 0.9em; opacity: 0.8;">
            💾 บันทึกอัตโนมัติ - ข้อมูลของคุณปลอดภัย
        </div> -->

        <!-- Control Panel -->
        <div class="control-panel">
            <h2 style="margin-bottom: 20px; color: #4CAF50;">⚙️ ตั้งค่าระบบ</h2>
            
            <div class="control-row">
                <div class="control-group">
                    <label>📝 นำเข้าข้อมูลพนักงาน (CSV/TXT)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv,.txt">
                        <label for="fileInput" class="file-input-label">
                            📁 เลือกไฟล์ (รูปแบบ: รหัส,ชื่อ)
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label>✏️ หรือกรอกข้อมูลด้วยตนเอง</label>
                    <textarea id="manualInput" placeholder="กรอกข้อมูล (หนึ่งคนต่อบรรทัด)
ตัวอย่าง:
E001,สมชาย ใจดี
E002,สมหญิง รักสงบ
E003 สมศักดิ์ มีสุข
หรือ:
E001 สมชาย
E002 สมหญิง"></textarea>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label>⏱️ เวลาในการสุ่ม (วินาที)</label>
                    <input type="number" id="duration" value="5" min="2" max="30" step="0.5">
                </div>

                <div class="control-group">
                    <label>🖼️ รูปพื้นหลัง Web (1920x1080)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="bgInput" accept="image/*">
                        <label for="bgInput" class="file-input-label">
                            📁 เลือกรูปพื้นหลัง (สำหรับ Fullscreen)
                        </label>
                    </div>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="removeWinner" checked>
                    <label for="removeWinner">🗑️ ลบชื่อผู้ได้รางวัลออกหลังสุ่ม</label>
                </div>
            </div>

            <div class="button-group">
                <button id="loadDataBtn">📥 โหลดข้อมูล</button>
                <button id="startBtn" disabled>🎰 เริ่มสุ่ม (\ Key)</button>
                <button id="fullscreenBtn" disabled>⛶ FULLSCREEN</button>
                <button id="resetBtn">🔄 รีเซ็ตระบบ</button>
                <button id="backHomeBtn" style="background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);">🏠 กลับหน้าแรก</button>
            </div>
        </div>

        <!-- Slot Machine -->
        <div class="slot-machine" id="slotMachine">
            <div class="slot-window" id="slotWindow">
                <div class="initial-message" id="initialMessage">The Winner is...</div>
                <div class="slot-items" id="slotItems" style="display: none;"></div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats">
            <h2 style="margin-bottom: 20px; color: #4CAF50;">📊 สถิติ</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalEmployees">0</div>
                    <div class="stat-label">ผู้เข้าร่วมทั้งหมด</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="remainingEmployees">0</div>
                    <div class="stat-label">ผู้เข้าร่วมคงเหลือ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="winnersCount">0</div>
                    <div class="stat-label">ผู้ได้รางวัล</div>
                </div>
            </div>

            <h3 style="margin-top: 30px; margin-bottom: 15px; color: #4CAF50;">🏆 รายชื่อผู้ได้รางวัล</h3>
            <div class="winners-list" id="winnersList"></div>
        </div>
    </div>

    <script>
        // Check if user came from index.html
        if (!sessionStorage.getItem('allowedAccess')) {
            // If not, redirect to index.html
            window.location.href = 'index.html';
        }

        // Auto-save key
        const SAVE_KEY = 'luckyDrawData';

        // Audio Context for sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // State management
        let employees = [];
        let originalEmployees = [];
        let isSpinning = false;
        let winners = [];
        let isFullscreen = false;
        let backgroundImage = null;
        let currentSlotIndex = 0;
        let animationInterval = null;
        let isShowingWinner = false;

        // DOM elements
        const fileInput = document.getElementById('fileInput');
        const bgInput = document.getElementById('bgInput');
        const manualInput = document.getElementById('manualInput');
        const loadDataBtn = document.getElementById('loadDataBtn');
        const startBtn = document.getElementById('startBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const resetBtn = document.getElementById('resetBtn');
        const backHomeBtn = document.getElementById('backHomeBtn');
        const durationInput = document.getElementById('duration');
        const removeWinnerCheckbox = document.getElementById('removeWinner');
        const slotMachine = document.getElementById('slotMachine');
        const slotWindow = document.getElementById('slotWindow');
        const slotItems = document.getElementById('slotItems');
        const initialMessage = document.getElementById('initialMessage');
        const totalEmployeesEl = document.getElementById('totalEmployees');
        const remainingEmployeesEl = document.getElementById('remainingEmployees');
        const winnersCountEl = document.getElementById('winnersCount');
        const winnersListEl = document.getElementById('winnersList');

        // Auto-save function
        function saveData() {
            const data = {
                employees: employees,
                originalEmployees: originalEmployees,
                winners: winners,
                manualInputValue: manualInput.value,
                durationValue: durationInput.value,
                removeWinnerChecked: removeWinnerCheckbox.checked,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            console.log('Data auto-saved at', data.timestamp);
        }

        // Load saved data
        function loadSavedData() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    
                    // Restore data
                    employees = data.employees || [];
                    originalEmployees = data.originalEmployees || [];
                    winners = data.winners || [];
                    
                    // Restore form values
                    if (data.manualInputValue) {
                        manualInput.value = data.manualInputValue;
                    }
                    if (data.durationValue) {
                        durationInput.value = data.durationValue;
                    }
                    removeWinnerCheckbox.checked = data.removeWinnerChecked !== false;
                    
                    // Update UI
                    if (employees.length > 0) {
                        startBtn.disabled = false;
                        fullscreenBtn.disabled = false;
                        renderSlotItems();
                        initialMessage.style.display = 'flex';
                        slotItems.style.display = 'none';
                    }
                    
                    updateStats();
                    updateWinnersList();
                    
                    console.log('Data restored from', data.timestamp);
                    
                    return true;
                } catch (error) {
                    console.error('Error loading saved data:', error);
                    return false;
                }
            }
            return false;
        }

        // Clear all saved data
        function clearAllData() {
            localStorage.removeItem(SAVE_KEY);
            console.log('All saved data cleared');
        }

        // Background image handler
        bgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    backgroundImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Fullscreen functionality
        function enterFullscreen() {
            isFullscreen = true;
            document.body.classList.add('fullscreen-active');
            
            // Apply background image or gradient
            if (backgroundImage) {
                document.body.style.backgroundImage = `url(${backgroundImage})`;
            } else {
                document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%)';
            }
            
            slotMachine.classList.add('fullscreen-mode');
            
            // Hide all other elements
            document.querySelectorAll('.container > *:not(.slot-machine)').forEach(el => {
                el.style.display = 'none';
            });
        }

        function exitFullscreen() {
            isFullscreen = false;
            document.body.classList.remove('fullscreen-active');
            document.body.style.backgroundImage = '';
            document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%)';
            
            slotMachine.classList.remove('fullscreen-mode');
            
            // Show all elements
            document.querySelectorAll('.container > *').forEach(el => {
                el.style.display = '';
            });
        }

        fullscreenBtn.addEventListener('click', enterFullscreen);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            // Backslash key (\) to start or reset after winner
            if (e.code === 'Backslash') {
                e.preventDefault();
                
                console.log('Space pressed. isShowingWinner:', isShowingWinner, 'isSpinning:', isSpinning, 'disabled:', startBtn.disabled);
                
                // If showing winner, go back to initial message
                if (isShowingWinner) {
                    // Find the current winner index before removing
                    const currentWinnerElement = document.querySelector('.slot-item.winner-blink');
                    if (currentWinnerElement) {
                        const winnerDataIndex = parseInt(currentWinnerElement.getAttribute('data-index'));
                        
                        // Remove winner from employees list if checkbox is checked
                        if (removeWinnerCheckbox.checked && winnerDataIndex >= 0) {
                            employees.splice(winnerDataIndex, 1);
                            console.log('Winner removed. Employees left:', employees.length);
                        }
                    }
                    
                    // Re-render items with updated list
                    if (employees.length > 0) {
                        renderSlotItems();
                    }
                    
                    // Remove blink effect
                    document.querySelectorAll('.slot-item').forEach(item => {
                        item.classList.remove('winner-blink');
                        item.classList.remove('active');
                    });
                    
                    // Show initial message
                    initialMessage.textContent = 'The Winner is...';
                    initialMessage.style.display = 'flex';
                    slotItems.style.display = 'none';
                    
                    isShowingWinner = false;
                    
                    // Update stats
                    updateStats();
                    
                    // Auto-save after winner handling
                    saveData();
                    
                    // Re-enable start button if there are employees left
                    if (employees.length > 0) {
                        startBtn.disabled = false;
                        console.log('Button re-enabled, employees left:', employees.length);
                    } else {
                        alert('สุ่มครบทุกคนแล้ว!');
                        initialMessage.textContent = 'All Winners Drawn!';
                        startBtn.disabled = true;
                    }
                }
                // If not spinning and button is enabled, start
                else if (!startBtn.disabled && !isSpinning) {
                    console.log('Starting spin');
                    startBtn.click();
                }
            }
            // ESC to exit fullscreen
            if (e.code === 'Escape' && isFullscreen) {
                exitFullscreen();
            }
        });

        // Sound generation functions
        function playSpinSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 600;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function playWinSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * 0.15);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.5);
            });
        }

        // Parse employee data
        function parseEmployeeData(text) {
            const lines = text.trim().split('\n');
            const parsed = [];
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                let parts;
                if (trimmed.includes(',')) {
                    parts = trimmed.split(',');
                } else {
                    parts = trimmed.split(/\s+/);
                }
                
                if (parts.length >= 2) {
                    parsed.push({
                        id: parts[0].trim(),
                        name: parts.slice(1).join(' ').trim()
                    });
                } else if (parts.length === 1) {
                    parsed.push({
                        id: parts[0].trim(),
                        name: parts[0].trim()
                    });
                }
            }
            
            return parsed;
        }

        // Load data from file
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    manualInput.value = event.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        // Load data button
        loadDataBtn.addEventListener('click', () => {
            const data = manualInput.value;
            
            console.log('Loading data...');
            
            if (!data.trim()) {
                alert('❌ กรุณากรอกข้อมูลหรือเลือกไฟล์ก่อน');
                return;
            }

            employees = parseEmployeeData(data);
            originalEmployees = [...employees];
            
            console.log('Parsed employees:', employees.length);
            
            if (employees.length === 0) {
                alert('❌ ไม่พบข้อมูลที่ถูกต้อง\n\nรูปแบบที่รองรับ:\n- E001,สมชาย ใจดี\n- E001 สมชาย');
                return;
            }

            updateStats();
            
            // Enable buttons
            startBtn.disabled = false;
            fullscreenBtn.disabled = false;
            
            console.log('Buttons enabled. startBtn.disabled:', startBtn.disabled);
            
            renderSlotItems();
            
            // Show initial message
            initialMessage.style.display = 'flex';
            slotItems.style.display = 'none';
            
            // Auto-save after loading
            saveData();
            
            alert(`✅ โหลดข้อมูลสำเร็จ!\n\nพบพนักงาน ${employees.length} คน\n\nพร้อมสุ่มแล้ว 🎰\n\nกด \\ (Backslash) หรือคลิกปุ่มเพื่อเริ่มสุ่ม`);
        });

        // Render slot items
        function renderSlotItems() {
            if (employees.length === 0) return;
            
            slotItems.innerHTML = '';
            
            employees.forEach((employee, index) => {
                const item = document.createElement('div');
                item.className = 'slot-item';
                item.setAttribute('data-index', index);
                
                // Check if ID and name are the same (no comma in input)
                if (employee.id === employee.name) {
                    // Single line, centered
                    item.innerHTML = `
                        <div class="employee-name">${employee.name}</div>
                    `;
                } else {
                    // Two lines: ID and name
                    item.innerHTML = `
                        <div class="employee-id">${employee.id}</div>
                        <div class="employee-name">${employee.name}</div>
                    `;
                }
                
                slotItems.appendChild(item);
            });
        }

        // Start spinning
        startBtn.addEventListener('click', () => {
            if (isSpinning || employees.length === 0) {
                console.log('Cannot start: isSpinning:', isSpinning, 'employees:', employees.length);
                return;
            }
            
            console.log('Starting animation');
            
            isSpinning = true;
            startBtn.disabled = true;
            
            // Hide initial message and show slot items
            initialMessage.style.display = 'none';
            slotItems.style.display = 'block';
            
            const duration = parseFloat(durationInput.value) * 1000;
            const startTime = Date.now();
            currentSlotIndex = 0;
            
            let currentDelay = 50;
            
            function animateStep() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                
                if (progress >= 1) {
                    finishSpin();
                    return;
                }
                
                document.querySelectorAll('.slot-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                const items = document.querySelectorAll('.slot-item');
                if (items.length > 0) {
                    currentSlotIndex = (currentSlotIndex + 1) % items.length;
                    items[currentSlotIndex].classList.add('active');
                    
                    if (progress < 0.9) {
                        playSpinSound();
                    }
                }
                
                const slowdownFactor = 1 + (progress * 8);
                currentDelay = 50 * slowdownFactor;
                
                setTimeout(animateStep, currentDelay);
            }
            
            animateStep();
        });

        // Finish spinning
        function finishSpin() {
            const winnerIndex = Math.floor(Math.random() * employees.length);
            const winner = employees[winnerIndex];
            
            console.log('Winner selected:', winner);
            
            document.querySelectorAll('.slot-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const items = document.querySelectorAll('.slot-item');
            if (items[winnerIndex]) {
                items[winnerIndex].classList.add('active');
            }
            
            setTimeout(() => {
                playWinSound();
                
                if (items[winnerIndex]) {
                    items[winnerIndex].classList.add('winner-blink');
                    
                    winners.push(winner);
                    updateWinnersList();
                    updateStats();
                    
                    // Auto-save after getting winner
                    saveData();
                    
                    isSpinning = false;
                    isShowingWinner = true;
                    
                    console.log('Winner showing. Employees left before removal:', employees.length);
                    
                    // Don't remove winner or re-render yet - wait for user to press space
                    // Just keep showing the blinking winner
                    
                    if (removeWinnerCheckbox.checked && employees.length === 1) {
                        // This was the last person
                        setTimeout(() => {
                            items[winnerIndex].classList.remove('winner-blink');
                            employees.splice(winnerIndex, 1);
                            alert('สุ่มครบทุกคนแล้ว!');
                            initialMessage.textContent = 'All Winners Drawn!';
                            initialMessage.style.display = 'flex';
                            slotItems.style.display = 'none';
                            isShowingWinner = false;
                            startBtn.disabled = true;
                            saveData();
                        }, 3000);
                    }
                }
            }, 500);
        }

        // Update statistics
        function updateStats() {
            totalEmployeesEl.textContent = originalEmployees.length;
            remainingEmployeesEl.textContent = employees.length;
            winnersCountEl.textContent = winners.length;
        }

        // Update winners list
        function updateWinnersList() {
            winnersListEl.innerHTML = '';
            winners.forEach((winner, index) => {
                const item = document.createElement('div');
                item.className = 'winner-item';
                item.innerHTML = `
                    <div class="winner-number">${index + 1}</div>
                    <div>
                        <strong>${winner.id}</strong> - ${winner.name}
                    </div>
                `;
                winnersListEl.appendChild(item);
            });
        }

        // Reset button
        resetBtn.addEventListener('click', () => {
            const confirmMsg = winners.length > 0 
                ? `คุณต้องการรีเซ็ตระบบใช่หรือไม่?\n\n⚠️ การดำเนินการนี้จะ:\n- ลบข้อมูลผู้ชนะทั้งหมด (${winners.length} คน)\n- ล้างข้อมูลที่บันทึกอัตโนมัติ\n- เริ่มต้นใหม่ทั้งหมด\n\nไม่สามารถยกเลิกได้!`
                : 'คุณต้องการรีเซ็ตระบบใช่หรือไม่? (ข้อมูลทั้งหมดจะถูกล้าง)';
            
            if (confirm(confirmMsg)) {
                employees = [...originalEmployees];
                winners = [];
                isSpinning = false;
                isShowingWinner = false;
                
                document.querySelectorAll('.slot-item').forEach(item => {
                    item.classList.remove('winner-blink');
                    item.classList.remove('active');
                });
                
                manualInput.value = '';
                fileInput.value = '';
                bgInput.value = '';
                backgroundImage = null;
                slotItems.innerHTML = '';
                winnersListEl.innerHTML = '';
                
                initialMessage.textContent = 'The Winner is...';
                initialMessage.style.display = 'flex';
                slotItems.style.display = 'none';
                
                if (isFullscreen) {
                    exitFullscreen();
                }
                
                updateStats();
                startBtn.disabled = true;
                fullscreenBtn.disabled = true;
                
                // Clear saved data
                clearAllData();
                
                alert('✅ รีเซ็ตระบบสำเร็จ!\n\nข้อมูลทั้งหมดถูกล้างแล้ว');
            }
        });

        // Initial render
        updateStats();
        
        // Load saved data on startup
        const dataRestored = loadSavedData();
        
        // Back to home button
        backHomeBtn.addEventListener('click', () => {
            if (confirm('คุณต้องการกลับหน้าแรกใช่หรือไม่?')) {
                // Clear session flag
                sessionStorage.removeItem('allowedAccess');
                // Redirect to index
                window.location.href = 'index.html';
            }
        });
        
        // Debug button state
        console.log('Initial button state:', startBtn.disabled);
        console.log('Data restored:', dataRestored);
    </script>
